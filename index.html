<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore world-class courses, connect with mentors, and join a global community of lifelong learners."
    />
    <title>SkillSphere - Learn skills that shape your future</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #182032;
        --muted: #5c677d;
        --accent: #0f9f8f;
        --accent-dark: #0a7168;
        --surface: #ffffff;
        --line: #d9e2ec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 15%, rgba(15, 159, 143, 0.18), transparent 28%),
          linear-gradient(135deg, #f7fbff 0%, #eef7f5 52%, #fff8ef 100%);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 18px;
      }

      .shell {
        width: min(100%, 980px);
        padding: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 70px rgba(24, 32, 50, 0.12);
      }

      .brand {
        margin: 0 0 18px;
        color: var(--accent-dark);
        font-size: 0.92rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 5.25rem);
        line-height: 0.96;
        letter-spacing: 0;
      }

      p {
        max-width: 640px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 8px;
        font-weight: 800;
        text-decoration: none;
      }

      .primary {
        color: #ffffff;
        background: var(--accent);
      }

      .secondary {
        color: var(--ink);
        border: 1px solid var(--line);
        background: var(--surface);
      }

      @media (max-width: 640px) {
        .shell {
          padding: 30px 22px;
        }

        .actions {
          display: grid;
        }

        a {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell" aria-labelledby="page-title">
        <p class="brand">SkillSphere</p>
        <h1 id="page-title">Learn skills that shape your future</h1>
        <p>
          Explore practical courses, discover trusted mentors, and keep building
          momentum with a learning community designed for growth.
        </p>
        <div class="actions">
          <a class="primary" href="/">Open SkillSphere</a>
          <a class="secondary" href="README.md">View Project Notes</a>
        </div>
      </section>
    </main>
  </body>
</html>
